<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List Web App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>ToDo List</h2>
    <div class="mb-3">
        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task">
        <select id="statusInput" class="form-select mt-2">
            <option value="Created" selected>Please select current status...</option>
            <option value="Created">Created</option>
            <option value="Ongoing">Ongoing</option>
            <option value="On-Hold">On-Hold</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
            <option value="Overdue">Overdue</option>
        </select>

        <button id="addTaskBtn" class="btn btn-primary mt-2">Add Task</button>
    </div>
    
    <ul id="taskList" class="list-group">
    
    </ul>

    <script src="script.js"></script>
</body>
</html>
