<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | My Tasks</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/x-icon" href="../assets/icons/task.png">
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 id="text">ToDo List App</h2>
            <img id="sidebarLogo" src="../assets/icons/task.png" alt="Site Logo" class="hidden">
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li>
                    <a href="../dashboard.html">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
        
                <li>
                    <a href="task.html" class="active">
                        <i class="fa-solid fa-list-check"></i>
                        <span>Tasks</span>
                    </a>
                </li>
        
                <li>
                    <a href="profile.html">
                        <i class="fa-solid fa-user-pen"></i>
                        <span>Profile</span>
                    </a>
                </li>

                <li>
                    <a href="bugreport.html">
                        <i class="fa-solid fa-bug"></i>
                        <span>Bug Report</span>
                    </a>
                </li>
        
                <li>
                    <a href="#">
                        <i class="fa-solid fa-person-walking-arrow-right"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
        <!-- Navbar -->
        <div class="navbar-container">
            <div class="navbar">
                <button class="toggle-btn" id="toggle-btn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <!-- <input type="text" class="search-bar" placeholder="Search tasks, category, status..."> -->
            </div>

            <div class="user-profile">
                <img src="../assets/images/user-avatar.png" alt="User Avatar" class="avatar">
                <span class="username">Anthony</span>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div class="dashboard-content">
            <div class="todo-wrapper">
        
                <!-- LEFT SIDE -->
                <section class="todo-left">
        
                    <div class="todo-header">
                        <h3>My Tasks</h3>
                    </div>
        
                    <div class="todo-controls">
        
                        <input type="text" 
                        id="searchInput" class="todo-search" 
                        placeholder="Search tasks, category, status. . .">
                        
                        <!-- <select id="statusFilter" class="todo-filter">
                            <option value="">All Status</option>
                            <option value="Created">Created</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="On-Hold">On-Hold</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>

                        <select id="categoryFilter" class="todo-filter">
                            <option value="">All Categories</option>
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Health">Health</option>
                            <option value="Hobby">Hobby</option>
                        </select> -->
                        
                        <!-- Add task trigger button -->
                        <button id="openAddModal" class="todo-btn btn-primary">
                            <i class="fa-solid fa-plus"></i> Add Task
                        </button>
        
                    </div>
        
                    <div class="table-container">
                        <table class="todo-table">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Date</th>
                                    <th>Task</th>
                                    <th>Category</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="todoTableBody">
                                <!-- Tasks loaded here via JS -->
                            </tbody>
                        </table>
                    </div>
        
                    <div class="table-footer">
                        <div class="entries-info" id="entriesInfo"></div>
                        <div class="pagination" id="pagination"></div>
                    </div>
        
                </section>
        
                <!-- RIGHT SIDE -->
                <aside class="todo-right">
                    <h3>Task Insights</h3>
                    <div class="chart-controls">
                        <select id="statusFilter" class="todo-filter">
                            <option value="">All Status</option>
                            <option value="Created">Created</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="On-Hold">On-Hold</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                        
                        <select id="categoryFilter" class="todo-filter">
                            <option value="">All Categories</option>
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Health">Health</option>
                            <option value="Hobby">Hobby</option>
                        </select>
                    </div>

                    <p class="text-muted">Progress Overview</p>
                    
                    <div class="chart-container">
                        <canvas id="statusChart"></canvas>
                    </div>

                    <p class="text-muted">Category Overview</p>
                    
                    <div class="chart-container">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </aside>
        
            </div>
        </div>
        <!-- End of Dashboard Content -->

        <!-- Modal for Adding Tasks -->
        <div class="modal" id="addTaskModal">

            <div class="modal-content">

                <div class="modal-header">
                    <h3>Add New Task</h3>
                    <span class="close-btn" data-close="addTaskModal">&times;</span>
                </div>

                <form id="addTaskForm">

                    <div class="form-group">
                        <label for="taskTitle">Task</label>
                        <input 
                            type="text"
                            id="taskTitle"
                            name="task"
                            class="form-control"
                            placeholder="Enter task title"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea
                            id="taskDescription"
                            name="description"
                            class="form-control form-textarea"
                            rows="4"
                            placeholder="Provide additional details about the task..."
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="taskCategory">Category</label>
                        <select id="taskCategory" name="category_id" class="form-control">
                            <option value="">Select Category</option>
                        </select>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn-primary">
                            Save Task
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal for Viewing Tasks -->
        <div class="modal" id="viewTaskModal">
            <div class="modal-content">

                <div class="modal-header">
                    <h3>Task Information</h3>
                    <span class="close-btn" data-close="viewTaskModal">&times;</span>
                </div>

                <form id="viewTaskForm">

                    <div class="form-group">
                        <label for="viewTaskTitle">Task</label>
                        <input 
                            type="text"
                            id="viewTaskTitle"
                            class="form-control"
                            readonly
                            disabled>
                    </div>

                    <div class="form-group">
                        <label for="viewTaskDescription">Description</label>
                        <textarea
                            id="viewTaskDescription"
                            class="form-control form-textarea"
                            rows="4"
                            readonly
                            disabled></textarea>
                    </div>

                    <div class="form-group">
                        <label for="viewTaskCategory">Category</label>
                        <input 
                            type="text"
                            id="viewTaskCategory"
                            class="form-control"
                            readonly
                            disabled>
                    </div>

                    <div class="form-group">
                        <label for="viewTaskStatus">Status</label>
                        <input 
                            type="text"
                            id="viewTaskStatus"
                            class="form-control"
                            readonly
                            disabled>
                    </div>

                    <div class="modal-footer">
                        <button type="button" id="viewModalCloseBtn" class="btn-primary">
                            Close
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <!-- Modal for Editing Tasks -->
        <div class="modal" id="editTaskModal">

            <div class="modal-content">

                <div class="modal-header">
                    <h3>Edit Task</h3>
                    <span class="close-btn" data-close="editTaskModal">&times;</span>
                </div>

                <form id="editTaskForm">

                    <input type="hidden" id="editTaskId" name="id">

                    <div class="form-group">
                        <label for="editTaskTitle">Task</label>
                        <input 
                            type="text"
                            id="editTaskTitle"
                            name="task"
                            class="form-control"
                            required
                            readonly
                            disabled>
                    </div>

                    <div class="form-group">
                        <label for="editTaskDescription">Description</label>
                        <textarea
                            id="editTaskDescription"
                            name="description"
                            class="form-control form-textarea"
                            rows="4"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="editTaskCategory">Category</label>
                        <select id="editTaskCategory" name="category_id" class="form-control">
                            <option value="">Select Category</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="editTaskStatus">Status</label>
                        <select id="editTaskStatus" name="status_id" class="form-control">
                            <option value="">Select Status</option>
                        </select>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn-primary">
                            Update Task
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
    <!-- End of Main Content -->
    <script src="/assets/js/sidebar-script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <script src="/assets/js/crud-script.js" defer></script>
    <script src="/assets/js/chart-script.js" defer></script>

</body>
</html>
