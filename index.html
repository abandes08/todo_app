<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo List Web App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <!-- Header -->
    <div class="d-flex align-items-center mb-4">
      <i class="bi bi-check2-square text-primary fs-2 me-2"></i>
      <h2 class="fw-bold mb-0">ToDo List</h2>
    </div>

    <!-- Card Layout -->
    <div class="card shadow-sm">
      <div class="card-body">
        <!-- Input Row -->
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task">
          </div>
          <div class="col-md-4">
            <select id="statusInput" class="form-select">
              <option value="" disabled selected>Please select status of task...</option>
              <option value="Created">Created</option>
              <option value="Ongoing">Ongoing</option>
              <option value="On-Hold">On-Hold</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
              <option value="Overdue">Overdue</option>
            </select>
          </div>
          <div class="col-md-2 d-grid">
            <button id="addTaskBtn" class="btn btn-primary">
              <i class="bi bi-plus-circle"></i> Add
            </button>
          </div>
        </div>

        <!-- Task List -->
        <table class="table table-striped">
            <thead class="">
                <tr>
                    <th scope="col">No.</th>
                    <th scope="col">Date Created</th>
                    <th scope="col">Task</th>
                    <th scope="col">Status</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
        </table>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
